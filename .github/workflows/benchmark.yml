name: Synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: Number of generated synthetic sessions
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run deterministic synthetic benchmark
        run: >-
          python scripts/benchmark.py
          --sessions "${{ inputs.sessions }}"
          --output benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-${{ inputs.sessions }}-sessions
          path: benchmark.json
          retention-days: 14
