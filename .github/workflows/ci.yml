name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          CODEX_HOME: ${{ runner.temp }}/synthetic-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          python -m pytest

  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src

  package:
    name: Build and fresh-install artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/synthetic-codex-home"
          CODEX_HOME="$RUNNER_TEMP/synthetic-codex-home" "$RUNNER_TEMP/wheel-smoke/bin/codex-insights" --help
          CODEX_HOME="$RUNNER_TEMP/synthetic-codex-home" "$RUNNER_TEMP/wheel-smoke/bin/codex-insights" version
          CODEX_HOME="$RUNNER_TEMP/synthetic-codex-home" "$RUNNER_TEMP/wheel-smoke/bin/codex-insights" doctor
      - name: Install and smoke-test sdist
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          CODEX_HOME="$RUNNER_TEMP/synthetic-codex-home" "$RUNNER_TEMP/sdist-smoke/bin/codex-insights" version

  macos-editable:
    name: macOS editable-install smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Normal install smoke
        run: |
          python -m venv "$RUNNER_TEMP/normal-install"
          "$RUNNER_TEMP/normal-install/bin/python" -m pip install .
          "$RUNNER_TEMP/normal-install/bin/python" -c "import codex_insights"
          "$RUNNER_TEMP/normal-install/bin/codex-insights" version
      - name: Editable install and hidden-pth guard
        env:
          CODEX_HOME: ${{ runner.temp }}/synthetic-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          python -m venv "$RUNNER_TEMP/codex-insights-dev"
          "$RUNNER_TEMP/codex-insights-dev/bin/python" -m pip install -e ".[dev]"
          "$RUNNER_TEMP/codex-insights-dev/bin/python" scripts/editable_install_guard.py
          "$RUNNER_TEMP/codex-insights-dev/bin/python" -c "import codex_insights"
          "$RUNNER_TEMP/codex-insights-dev/bin/codex-insights" --help

  windows-installed:
    name: Windows installed smoke (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel and exercise synthetic workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $venv = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          $cli = Join-Path $venv "Scripts\codex-insights.exe"
          $wheel = (Get-ChildItem "dist\*.whl").FullName
          & $python -m pip install $wheel

          $syntheticCodexHome = Join-Path $env:RUNNER_TEMP "synthetic-codex-home"
          Copy-Item -Recurse "tests\fixtures\source_audit\codex_home" $syntheticCodexHome
          & $python -c "import sqlite3,sys; from pathlib import Path; home=Path(sys.argv[1]); schema=Path(sys.argv[2]).read_text(encoding='utf-8'); connection=sqlite3.connect(home/'state_7.sqlite'); connection.executescript(schema); connection.close()" $syntheticCodexHome "tests\fixtures\source_audit\state_fixture.sql"

          $database = Join-Path $env:RUNNER_TEMP "codex-insights.sqlite3"
          & $cli version
          & $cli doctor --codex-home $syntheticCodexHome --json
          & $cli index --codex-home $syntheticCodexHome --db $database
          & $cli stats --codex-home $syntheticCodexHome --db $database --json
          & $cli usage --codex-home $syntheticCodexHome --db $database --by day --timezone UTC --json
          & $python -c "import sys; from pathlib import Path; from codex_insights.db import open_source_sqlite_readonly; connection=open_source_sqlite_readonly(Path(sys.argv[1])); assert connection.execute('PRAGMA query_only').fetchone()[0] == 1; connection.close()" (Join-Path $syntheticCodexHome "state_7.sqlite")

          $dashboard = Join-Path $env:RUNNER_TEMP "dashboard.html"
          & $cli dashboard --codex-home $syntheticCodexHome --db $database --output $dashboard
          & $cli dashboard --codex-home $syntheticCodexHome --db $database --output $dashboard --overwrite

          $PSNativeCommandUseErrorActionPreference = $false
          & $cli dashboard --codex-home $syntheticCodexHome --db $database --output (Join-Path $syntheticCodexHome "forbidden.html")
          if ($LASTEXITCODE -eq 0) { throw "source-home output guard did not reject the path" }
          if (Test-Path (Join-Path $syntheticCodexHome "forbidden.html")) { throw "guarded output was created" }
          $PSNativeCommandUseErrorActionPreference = $true

          & $python scripts/benchmark.py --sessions 5 --repositories 1 --models 1
